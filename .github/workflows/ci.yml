name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Unit tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: python3 -m unittest test_filter_lcov -v
